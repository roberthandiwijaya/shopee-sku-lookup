{% extends "base.html" %}

{% block content %}
<div id="alert-banner-container"
     hx-get="/partials/alert-banner"
     hx-trigger="every 30s"
     hx-swap="innerHTML">
    {% include "partials/alert_banner.html" %}
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <!-- Sync Status Panel (2/3 width) -->
    <div class="lg:col-span-2">
        <div id="sync-status-container"
             hx-get="/partials/sync-status"
             hx-trigger="every 30s"
             hx-swap="innerHTML">
            {% include "partials/sync_status.html" %}
        </div>
    </div>

    <!-- Auth Panel (1/3 width) -->
    <div>
        <div id="auth-container"
             hx-get="/partials/auth"
             hx-trigger="every 30s"
             hx-swap="innerHTML">
            {% include "partials/auth_panel.html" %}
        </div>
    </div>
</div>

<!-- Product Table (full width) -->
<div>
    {% include "partials/product_table.html" %}
</div>
{% endblock %}
