<div class="rounded-lg bg-white shadow transition-colors dark:bg-slate-900 dark:shadow-none dark:ring-1 dark:ring-slate-800">
    <div class="border-b border-slate-200 p-6 dark:border-slate-800">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Products</h2>
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-end">
                <div class="flex flex-wrap gap-2">
                    <button hx-get="/partials/product-table{% if search %}?search={{ search | urlencode }}{% endif %}"
                            hx-target="#product-table-container"
                            hx-swap="innerHTML"
                            class="rounded-full border px-3 py-1 text-xs transition-colors {% if not partner_filter %}border-orange-300 bg-orange-50 text-orange-700 dark:border-orange-500/60 dark:bg-orange-500/10 dark:text-orange-200{% else %}border-slate-300 text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800{% endif %}">All</button>
                    <button hx-get="/partials/product-table?partner_filter=has_partners{% if search %}&search={{ search | urlencode }}{% endif %}"
                            hx-target="#product-table-container"
                            hx-swap="innerHTML"
                            class="rounded-full border px-3 py-1 text-xs transition-colors {% if partner_filter == 'has_partners' %}border-orange-300 bg-orange-50 text-orange-700 dark:border-orange-500/60 dark:bg-orange-500/10 dark:text-orange-200{% else %}border-slate-300 text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800{% endif %}">Has partners</button>
                    <button hx-get="/partials/product-table?partner_filter=no_partners{% if search %}&search={{ search | urlencode }}{% endif %}"
                            hx-target="#product-table-container"
                            hx-swap="innerHTML"
                            class="rounded-full border px-3 py-1 text-xs transition-colors {% if partner_filter == 'no_partners' %}border-orange-300 bg-orange-50 text-orange-700 dark:border-orange-500/60 dark:bg-orange-500/10 dark:text-orange-200{% else %}border-slate-300 text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800{% endif %}">No partners</button>
                    <button hx-get="/partials/product-table?partner_filter=has_family_code{% if search %}&search={{ search | urlencode }}{% endif %}"
                            hx-target="#product-table-container"
                            hx-swap="innerHTML"
                            class="rounded-full border px-3 py-1 text-xs transition-colors {% if partner_filter == 'has_family_code' %}border-orange-300 bg-orange-50 text-orange-700 dark:border-orange-500/60 dark:bg-orange-500/10 dark:text-orange-200{% else %}border-slate-300 text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800{% endif %}">Has code</button>
                    <button hx-get="/partials/product-table?partner_filter=no_family_code{% if search %}&search={{ search | urlencode }}{% endif %}"
                            hx-target="#product-table-container"
                            hx-swap="innerHTML"
                            class="rounded-full border px-3 py-1 text-xs transition-colors {% if partner_filter == 'no_family_code' %}border-orange-300 bg-orange-50 text-orange-700 dark:border-orange-500/60 dark:bg-orange-500/10 dark:text-orange-200{% else %}border-slate-300 text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800{% endif %}">No code</button>
                </div>
                <div id="product-search-controls" class="relative">
                    <input type="hidden" name="partner_filter" value="{{ partner_filter or '' }}">
                    <input type="text"
                           name="search"
                           value="{{ search or '' }}"
                           placeholder="Search by name, SKU, or family code..."
                           hx-get="/partials/products"
                           hx-trigger="input changed delay:300ms, search"
                           hx-target="#product-tbody"
                           hx-swap="innerHTML"
                           hx-include="#product-search-controls"
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm text-slate-700 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-300 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:placeholder:text-slate-500 sm:w-72">
                </div>
            </div>
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-xs uppercase text-slate-600 dark:bg-slate-800/80 dark:text-slate-400">
                <tr>
                    <th class="px-6 py-3 text-left w-8"></th>
                    <th class="px-6 py-3 text-left">Item Name</th>
                    <th class="px-6 py-3 text-left">SKU</th>
                    <th class="px-6 py-3 text-left">Status</th>
                    <th class="px-6 py-3 text-right">Price</th>
                    <th class="px-6 py-3 text-right">Stock</th>
                    <th class="px-6 py-3 text-left">Last Sync</th>
                </tr>
            </thead>
            <tbody id="product-tbody">
                {% include "partials/product_rows.html" %}
            </tbody>
        </table>
    </div>
</div>
