{% if alert %}
<div class="bg-red-600 text-white px-4 py-3 rounded-lg mb-6 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
        <span class="text-sm font-medium">
            {% if alert.expires_at %}
                Shopee authorization for shop {{ alert.shop_id }} expires on {{ alert.expires_at.strftime('%-d %b %Y %H:%M') }} WIB. Please re-authorize.
            {% else %}
                {{ alert.message }}
            {% endif %}
        </span>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
        <a href="{{ auth_url }}" target="_blank"
           class="bg-white text-red-600 hover:bg-red-50 px-3 py-1 rounded text-xs font-semibold transition-colors">
            Re-authorize
        </a>
        <button hx-post="/partials/alert-dismiss/{{ alert.id }}"
                hx-target="#alert-banner-container"
                hx-swap="innerHTML"
                class="text-red-200 hover:text-white transition-colors p-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
</div>
{% endif %}
