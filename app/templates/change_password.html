{% extends "base.html" %}

{% block title %}Change Password - Shopee SKU Dashboard{% endblock %}

{% block content %}
<div class="flex items-center justify-center mt-12">
    <div class="w-full max-w-sm">
        <div class="bg-white shadow-lg rounded-lg p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-2">Change Password</h2>
            <p class="text-gray-500 text-sm mb-6">Please set a new password to continue.</p>

            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/change-password" class="space-y-4">
                <div>
                    <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" id="new_password" name="new_password" required autofocus
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
                </div>
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
                </div>
                <button type="submit"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-md transition-colors">
                    Update Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
