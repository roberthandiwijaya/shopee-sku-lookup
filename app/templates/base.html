<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Idola Style - Shopee SKU Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-orange-500 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <span class="text-white text-xl font-bold">Idola Style - Shopee SKU Dashboard</span>
                {% if request.session.get("username") %}
                <a href="/" class="text-orange-100 hover:text-white text-sm font-medium {% if request.url.path == '/' %}border-b-2 border-white pb-0.5{% endif %}">Dashboard</a>
                <a href="/discounts" class="text-orange-100 hover:text-white text-sm font-medium {% if request.url.path.startswith('/discounts') %}border-b-2 border-white pb-0.5{% endif %}">Discounts</a>
                {% endif %}
            </div>
            <div class="flex items-center space-x-4">
                <a href="/docs" target="_blank" class="text-orange-100 hover:text-white text-sm">API Docs</a>
                {% if request.session.get("username") %}
                <span class="text-orange-100 text-sm">{{ request.session["username"] }}</span>
                <a href="/change-password" class="text-orange-100 hover:text-white text-sm">Change Password</a>
                <a href="/logout" class="bg-orange-600 hover:bg-orange-700 text-white text-sm px-3 py-1 rounded">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
