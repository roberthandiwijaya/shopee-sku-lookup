{% extends "base.html" %}

{% block title %}Login - Shopee SKU Dashboard{% endblock %}

{% block content %}
<div class="mt-12 flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="rounded-lg bg-white p-8 shadow-lg transition-colors dark:bg-slate-900 dark:shadow-none dark:ring-1 dark:ring-slate-800">
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold text-orange-500">Idola Style</h1>
                <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Shopee SKU Dashboard</p>
            </div>

            {% if error %}
            <div class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900/70 dark:bg-red-950/40 dark:text-red-300">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" class="space-y-4">
                <div>
                    <label for="username" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Username</label>
                    <input type="text" id="username" name="username" required autofocus
                        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100">
                </div>
                <div>
                    <label for="password" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100">
                </div>
                <button type="submit"
                    class="w-full rounded-md bg-orange-500 px-4 py-2 font-medium text-white transition-colors hover:bg-orange-600">
                    Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
